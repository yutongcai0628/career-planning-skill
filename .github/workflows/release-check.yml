name: Release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run release tests
        run: python -m unittest discover -s tests -v
      - name: Validate optional cross-host result schema
        run: python scripts/validate_host_results.py tests/host-validation-results.json
      - name: Validate example report
        run: python .claude/skills/career-planning/scripts/validate_report.py examples/职业决策报告示例.html
      - name: Build RedSkill package
        run: python scripts/build_release.py
