<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职业规划报告 · {{NAME}}</title>
<!--
  使用说明（给填充这个模板的 AI 看，不要保留在最终文件里）：
  1. 替换 {{NAME}} {{DATE}} {{TAGLINE}} {{CONTENT}}。
  2. 视觉基调是 Kinfolk 式杂志编辑排版：大量留白、衬线标题、细线分隔、
     奶油纸色底、极克制的暖棕点缀。填充内容时不要往里加彩色块、阴影、
     渐变或 emoji 堆砌——安静是这个模板的核心。
  3. 用户粘贴的 JD、履历、聊天原文必须先转义 & < > " '，不能保留
     script/iframe/on* 事件属性或外链脚本；只允许模型自己生成的结构标签进入。
  4. 图表用安全内联 SVG，粘进 .chart-card 或 .whiteboard；独立 HTML 里没有
     widget 的 CSS 变量，SVG 配色改用本模板 :root 的固定色。
  5. 结构件：section / .kicker / .pullquote / .callout / .insight-grid /
     .chart-card / .whiteboard / .matrix / .timeline / ol.actions / .footnote。
  6. 输出文件存到 职业档案/报告/ 下，文件名如「职业规划报告-姓名-日期.html」。
-->
<style>
  :root{
    --paper:#faf8f3; --panel:#fffdf9;
    --ink:#21201c; --muted:#6f6a60; --faint:#9a948a;
    --hairline:#e3ded2; --hairline-dark:#c9c2b2;
    --accent:#8c6b4f;
    --ok:#5f7355; --warn:#a8823e; --bad:#9c4a3c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:16px; line-height:1.95; font-weight:400;
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:"Playfair Display","Noto Serif SC","Songti SC",STSong,"SimSun",serif;}
  .page{max-width:720px; margin:0 auto; padding:0 32px 110px;}

  /* ── 封面：居中、安静、像杂志扉页 ── */
  header.cover{ text-align:center; padding:96px 0 64px; }
  .kicker{
    font-size:11px; letter-spacing:.42em; text-transform:uppercase;
    color:var(--accent); font-weight:500; margin-bottom:34px;
  }
  .kicker::after{
    content:""; display:block; width:36px; height:1px;
    background:var(--hairline-dark); margin:26px auto 0;
  }
  h1{
    font-family:"Playfair Display","Noto Serif SC","Songti SC",STSong,serif;
    font-size:40px; line-height:1.42; font-weight:600; letter-spacing:.02em;
    margin:0 0 26px;
  }
  .tagline{
    font-size:15.5px; color:var(--muted); font-style:normal;
    max-width:480px; margin:0 auto 44px;
  }
  .meta{
    display:flex; justify-content:center; gap:34px; flex-wrap:wrap;
    font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint);
  }
  .meta b{color:var(--ink); font-weight:500; letter-spacing:.08em;}
  .cover-rule{ border:0; border-top:1px solid var(--hairline); margin:64px auto 0; }

  /* ── 章节 ── */
  section{margin:0 0 84px;}
  section > h2{
    font-family:"Playfair Display","Noto Serif SC","Songti SC",STSong,serif;
    font-size:25px; font-weight:600; letter-spacing:.03em;
    margin:0 0 30px; padding-top:34px; position:relative;
  }
  section > h2::before{
    content:""; position:absolute; top:0; left:0;
    width:34px; height:1px; background:var(--accent);
  }
  h3{
    font-size:16px; font-weight:600; letter-spacing:.05em; margin:34px 0 12px;
  }
  p{margin:0 0 20px;}
  strong{font-weight:600;}
  .lead{
    font-family:"Playfair Display","Noto Serif SC","Songti SC",STSong,serif;
    font-size:19px; line-height:1.9; color:#3a382f;
  }

  /* ── 引言 / 金句：居中斜体衬线，Kinfolk 的招牌 ── */
  .pullquote{
    text-align:center; margin:56px 0; padding:44px 24px;
    border-top:1px solid var(--hairline); border-bottom:1px solid var(--hairline);
  }
  .pullquote p{
    font-family:"Playfair Display","Noto Serif SC","Songti SC",STSong,serif;
    font-size:21px; line-height:2; font-style:italic; margin:0; color:var(--ink);
  }
  .pullquote .by{
    display:block; margin-top:18px; font-style:normal; font-size:11px;
    letter-spacing:.34em; text-transform:uppercase; color:var(--faint);
  }

  /* ── 核心洞察 ── */
  .callout{
    margin:32px 0; padding:26px 30px; background:var(--panel);
    border:1px solid var(--hairline);
  }
  .callout .label{
    font-size:11px; letter-spacing:.34em; text-transform:uppercase;
    color:var(--accent); margin-bottom:10px; font-weight:500;
  }
  .callout p{margin:0;}

  /* ── 三栏小卡：细线分隔，无底色 ── */
  .insight-grid{
    display:grid; grid-template-columns:repeat(3,1fr); margin:36px 0;
    border-top:1px solid var(--hairline);
  }
  .insight-card{
    padding:24px 20px 8px; border-bottom:1px solid var(--hairline);
  }
  .insight-card + .insight-card{border-left:1px solid var(--hairline);}
  .insight-card b{
    display:block; font-family:"Playfair Display","Noto Serif SC","Songti SC",serif;
    font-size:16px; font-weight:600; margin-bottom:10px;
  }
  .insight-card p{font-size:13.5px; color:var(--muted); line-height:1.85;}

  /* ── 图表 / 画板 ── */
  .chart-card,.whiteboard{
    margin:44px 0; padding:36px 28px 26px; background:var(--panel);
    border:1px solid var(--hairline); text-align:center;
  }
  .chart-card svg,.whiteboard svg{max-width:100%; height:auto;}
  .cap{
    margin-top:18px; font-size:12.5px; color:var(--faint); font-style:italic;
    letter-spacing:.06em;
  }
  .cap::before{content:"— "; color:var(--hairline-dark);}

  /* ── 四象限 ── */
  .matrix{
    display:grid; grid-template-columns:1fr 1fr; margin:32px 0;
    border:1px solid var(--hairline); background:var(--panel);
  }
  .matrix > div{padding:22px 24px; border-right:1px solid var(--hairline); border-bottom:1px solid var(--hairline); min-height:110px;}
  .matrix > div:nth-child(2n){border-right:0;}
  .matrix > div:nth-last-child(-n+2){border-bottom:0;}
  .matrix b{display:block; font-size:14px; margin-bottom:8px;}
  .matrix p{font-size:13.5px; color:var(--muted); margin:0; line-height:1.8;}

  /* ── 时间线 ── */
  .timeline{margin:32px 0;}
  .timeline-item{
    display:grid; grid-template-columns:110px 1fr; gap:24px;
    padding:18px 4px; border-bottom:1px solid var(--hairline);
  }
  .timeline-item:first-child{border-top:1px solid var(--hairline);}
  .timeline-item time{
    font-size:12px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--accent); padding-top:5px;
  }
  .timeline-item p{margin:0; font-size:15px;}

  /* ── 行动清单：编辑部风格的编号 ── */
  ol.actions{list-style:none; counter-reset:a; padding:0; margin:32px 0;}
  ol.actions li{
    counter-increment:a; display:grid; grid-template-columns:56px 1fr; gap:20px;
    padding:20px 4px; border-bottom:1px solid var(--hairline); align-items:baseline;
  }
  ol.actions li:first-child{border-top:1px solid var(--hairline);}
  ol.actions li::before{
    content:"№ " counter(a);
    font-family:"Playfair Display","Noto Serif SC",serif;
    font-size:15px; font-style:italic; color:var(--accent);
  }

  /* ── 状态色（匹配度/风险，用文字色而非色块） ── */
  .ok{color:var(--ok);} .warn{color:var(--warn);} .bad{color:var(--bad);}

  /* ── 脚注 / 免责声明 ── */
  .footnote{
    margin-top:96px; padding-top:28px; border-top:1px solid var(--hairline);
    text-align:center; font-size:12.5px; color:var(--faint); line-height:2;
  }
  .footnote .fin{
    display:block; margin-bottom:18px; font-family:"Playfair Display",serif;
    font-size:14px; font-style:italic; color:var(--hairline-dark); letter-spacing:.3em;
  }

  @media (max-width:640px){
    h1{font-size:30px;}
    .insight-grid{grid-template-columns:1fr;}
    .insight-card + .insight-card{border-left:0;}
    .timeline-item,ol.actions li{grid-template-columns:1fr; gap:6px;}
  }
  @media print{
    body{background:#fff;}
    .page{max-width:none; padding:0 14mm;}
    section,.chart-card,.callout,.pullquote{break-inside:avoid;}
  }
</style>
</head>
<body>
<div class="page">

  <header class="cover">
    <div class="kicker">Career Planning Journal · 职业规划</div>
    <h1>{{TAGLINE}}</h1>
    <p class="tagline">一份为你而写的职业规划——像一期只印一册的杂志</p>
    <div class="meta">
      <span>For · <b>{{NAME}}</b></span>
      <span>Issue · <b>{{DATE}}</b></span>
    </div>
    <hr class="cover-rule">
  </header>

  {{CONTENT}}
  <!-- CONTENT 结构示例（填充时删除本注释）：

  <section>
    <h2>一、我对你的判断</h2>
    <p class="lead">……开篇判断，用衬线大字给它应有的分量……</p>
    <div class="callout">
      <div class="label">The Insight · 核心洞察</div>
      <p>那句最关键的话。</p>
    </div>
  </section>

  <div class="pullquote">
    <p>"你站在金矿上，却以为自己在搬砖。"</p>
    <span class="by">本期主题</span>
  </div>

  <section>
    <h2>二、核心分析</h2>
    <p>……</p>
    <div class="chart-card">
      （安全内联 SVG，配色用 :root 固定色）
      <div class="cap">图一 · 你的能力甜区</div>
    </div>
  </section>

  <section>
    <h2>四、接下来 30 / 90 天</h2>
    <ol class="actions">
      <li>第一件可以立刻动手的事。</li>
      <li>第二件。</li>
    </ol>
  </section>
  -->

  <div class="footnote">
    <span class="fin">· fin ·</span>
    以上分析与建议仅供参考，不构成职业、法律、投资等任何方面的直接指导；<br>
    所有选择的最终决定权始终在你自己手上。<br>
    由「职业规划导师」skill 生成
  </div>
</div>
</body>
</html>
