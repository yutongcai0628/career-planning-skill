<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职业规划报告 · {{NAME}}</title>
<!--
  1. 替换 {{NAME}}、{{DATE}}、{{TITLE}}、{{SUMMARY}}、{{CONTENT}}。
  2. 用户提供的文本先转义 & < > " '；不得保留 script、iframe、on* 事件属性或外链资源。
  3. 每份完整报告保留一张支持结论的图或表：.evidence-bars、.decision-board、.quadrant、.timeline 任选。
  4. 数据不足时写「证据充分 / 待验证 / 暂无证据」，不要生成没有依据的精确分数。
  5. 中文用微软雅黑；英文、数字、缩写和编号用 Futura。不要添加头图、图片、CDN、外链字体或 JavaScript。
-->
<style>
  :root {
    --canvas:#ded9cf; --paper:#f8f4ec; --ink:#171512; --muted:#625d55;
    --faint:#91897d; --line:#26221d; --soft-line:#d4cdbf;
    --forest:#234f45; --forest-tint:#e3e9df; --ochre:#a97825;
    --ochre-tint:#f1e7cf; --brick:#9c4e38; --brick-tint:#f2dfd7;
    --zh:"Microsoft YaHei","微软雅黑","PingFang SC",sans-serif;
    --en:Futura,"Futura PT","Century Gothic",sans-serif;
  }
  *{box-sizing:border-box} html,body{min-height:100%}
  body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--zh);font-size:16px;line-height:1.9;-webkit-font-smoothing:antialiased}
  .report{max-width:940px;margin:32px auto;padding:0 28px 76px}
  .sheet{overflow:hidden;background:var(--paper);border:1px solid rgba(23,21,18,.26);border-radius:8px;box-shadow:0 18px 42px rgba(49,39,28,.13)}
  .report-header{padding:34px 50px 30px;text-align:center}
  .report-type,.english-title,.issue,.cover-meta,.bar-value,.timeline-item time,ol.actions li::before{font-family:var(--en)}
  .report-type{margin:0 0 2px;font-size:12px;font-weight:600;letter-spacing:.18em}
  .english-title{margin:0;font-size:clamp(32px,5vw,52px);line-height:1.12;font-weight:500;letter-spacing:.05em}
  .issue{margin:4px 0 17px;font-size:13px;font-weight:600;letter-spacing:.16em}
  .cover-rule{border:0;border-top:1px solid var(--line);margin:0 -50px 16px}
  .cover-topic{margin:0 0 12px;color:var(--muted);font-size:14px;font-weight:700;letter-spacing:.08em}
  h1{max-width:760px;margin:0 auto;text-align:left;font-size:clamp(34px,5.2vw,57px);line-height:1.32;font-weight:500;letter-spacing:.02em}
  .summary{max-width:730px;margin:22px auto 28px;text-align:left;color:#48423b;font-size:17px;line-height:1.9}
  .cover-meta{display:flex;justify-content:flex-start;gap:30px;padding-top:15px;border-top:1px solid var(--line);font-size:12px;font-weight:600;letter-spacing:.08em}
  .content{padding:0 50px 46px} section{margin-top:42px;padding-top:34px;border-top:1px solid var(--line)} section:first-child{margin-top:0}
  h2{margin:0 0 19px;font-size:25px;line-height:1.45;font-weight:600} h3{margin:26px 0 10px;font-size:17px;line-height:1.55;font-weight:600}
  p{margin:0 0 15px} strong{font-weight:700}.lead{max-width:775px;font-size:20px;line-height:1.78}.source-note{margin:13px 0 0;color:var(--muted);font-size:13px;line-height:1.7}
  .summary-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;margin:26px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .summary-cell{min-height:132px;padding:20px 20px 18px 0}.summary-cell+.summary-cell{padding-left:20px;border-left:1px solid var(--soft-line)}
  .summary-cell b{display:block;font-size:17px;line-height:1.5}.summary-cell p{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.75}
  .summary-cell.primary b{color:var(--forest)}.summary-cell.warn b{color:#76510e}.summary-cell.risk b{color:var(--brick)}
  .callout{margin:24px 0;padding:21px 24px;border-left:3px solid var(--forest);background:var(--forest-tint)}.callout.warn{border-left-color:var(--ochre);background:var(--ochre-tint)}.callout.risk{border-left-color:var(--brick);background:var(--brick-tint)}.callout p{margin:0;font-size:16px}
  .evidence-bars{margin:25px 0}.bar-row{display:grid;grid-template-columns:minmax(116px,1fr) minmax(170px,2.5fr) 92px;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--soft-line)}.bar-row:first-child{border-top:1px solid var(--soft-line)}.bar-label{font-size:15px;line-height:1.45}.bar-track{height:8px;overflow:hidden;background:#e1dbd0}.bar-fill{display:block;width:var(--w,50%);height:100%;background:var(--forest)}.bar-fill.warn{background:var(--ochre)}.bar-fill.risk{background:var(--brick)}.bar-value{color:var(--muted);font-size:13px;text-align:right;white-space:nowrap}
  .decision-board{margin:28px 0;border:1px solid var(--line);background:#f4eee3}.board-head{padding:15px 20px;border-bottom:1px solid var(--line)}.board-title{margin:0;font-size:17px;font-weight:600}.board-canvas{position:relative;min-height:306px;padding:30px 28px;overflow:hidden}.board-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.board-lines path{fill:none;stroke:#7c766e;stroke-width:1.5;stroke-linecap:round}.node{position:relative;z-index:1;width:min(46%,290px);min-height:84px;padding:16px;border:1px solid var(--line);background:#fcf9f2}.node b{display:block;font-size:15px;line-height:1.45}.node span{display:block;margin-top:6px;color:var(--muted);font-size:13px;line-height:1.6}.node.decision{margin:14px auto 28px;border-width:2px;border-color:var(--forest);text-align:center}.node.option-a{float:left}.node.option-b{float:right;border-color:var(--ochre)}.board-canvas::after{content:"";display:block;clear:both}
  .quadrant{display:grid;grid-template-columns:1fr 1fr;margin:25px 0;border:1px solid var(--line)}.quadrant>div{min-height:145px;padding:21px;border-right:1px solid var(--soft-line);border-bottom:1px solid var(--soft-line)}.quadrant>div:nth-child(2n){border-right:0}.quadrant>div:nth-last-child(-n+2){border-bottom:0}.quadrant .q-title{display:block;margin-bottom:9px;font-size:16px;font-weight:600}.quadrant p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
  .timeline{margin:24px 0}.timeline-item{display:grid;grid-template-columns:116px 1fr;gap:24px;padding:19px 0;border-bottom:1px solid var(--soft-line)}.timeline-item:first-child{border-top:1px solid var(--soft-line)}.timeline-item time{color:var(--forest);font-size:13px;font-weight:600;letter-spacing:.04em}.timeline-item b{display:block;margin-bottom:5px;font-size:16px}.timeline-item p{margin:0;color:var(--muted);font-size:14px;line-height:1.75}
  ol.actions{margin:21px 0 0;padding:0;list-style:none;counter-reset:action}ol.actions li{display:grid;grid-template-columns:45px 1fr;gap:15px;padding:18px 0;border-bottom:1px solid var(--soft-line);counter-increment:action}ol.actions li:first-child{border-top:1px solid var(--soft-line)}ol.actions li::before{content:counter(action,decimal-leading-zero);color:var(--forest);font-size:14px;font-weight:600;padding-top:2px}ol.actions b{display:block;font-size:16px;line-height:1.5}ol.actions p{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.75}
  details{margin:24px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}summary{padding:14px 0;cursor:pointer;font-size:15px;font-weight:600}details>div{padding:0 0 15px}.report-footer{padding:25px 50px 31px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.7}
  @media(max-width:680px){body{font-size:15px}.report{margin:0;padding:0}.sheet{border:0;border-radius:0;box-shadow:none}.report-header,.content,.report-footer{padding-left:24px;padding-right:24px}.report-header{padding-top:30px}.cover-rule{margin-left:-24px;margin-right:-24px}.cover-meta{flex-direction:column;gap:5px}.summary-grid{grid-template-columns:1fr}.summary-cell,.summary-cell+.summary-cell{min-height:auto;padding:17px 0;border-left:0;border-top:1px solid var(--soft-line)}.summary-cell:first-child{border-top:0}.bar-row{grid-template-columns:92px 1fr 72px;gap:10px}.bar-label{font-size:14px}.node{width:100%}.node.decision{margin:0 0 16px}.node.option-a,.node.option-b{float:none}.board-lines{display:none}.board-canvas{min-height:auto}.node+.node{margin-top:12px}.quadrant{grid-template-columns:1fr}.quadrant>div,.quadrant>div:nth-child(2n){border-right:0;border-bottom:1px solid var(--soft-line)}.quadrant>div:last-child{border-bottom:0}.timeline-item{grid-template-columns:1fr;gap:4px}}
  @media print{@page{margin:12mm}html,body{background:#fff}.report{max-width:none;margin:0;padding:0}.sheet{border:0;border-radius:0;box-shadow:none}section,.summary-grid,.decision-board,.quadrant,.timeline-item,ol.actions li,.callout{break-inside:avoid}}
</style>
</head>
<body>
<main class="report">
  <article class="sheet">
    <header class="report-header">
      <p class="report-type">CAREER PLANNING REPORT</p>
      <p class="english-title">CAREER INDEX</p>
      <p class="issue">DECISION EDITION</p>
      <hr class="cover-rule">
      <p class="cover-topic">职业方向 · 岗位选择 · 行动规划</p>
      <h1>{{TITLE}}</h1>
      <p class="summary">{{SUMMARY}}</p>
      <div class="cover-meta"><span>{{DATE}}</span><span>{{NAME}}</span></div>
    </header>
    <div class="content">
      {{CONTENT}}
      <!--
      <section>
        <h2>结论</h2>
        <p class="lead">建议先留在当前公司 6 个月，同时争取客户研究项目；现在离职的收益不足以覆盖试错成本。</p>
        <div class="summary-grid">
          <div class="summary-cell primary"><b>留任并转向研究型项目</b><p>先用现有平台补足作品与行业证据。</p></div>
          <div class="summary-cell warn"><b>确认团队是否支持转型</b><p>两周内和直属负责人确认资源。</p></div>
          <div class="summary-cell risk"><b>6 个月仍无项目机会</b><p>届时将外部求职转为主路径。</p></div>
        </div>
      </section>
      -->
    </div>
    <footer class="report-footer">本报告基于用户提供的信息和可核实资料，不保证特定结果，也不构成职业、法律、财务、医疗或心理健康等专业意见。重要决定请结合完整信息，由本人作出。</footer>
  </article>
</main>
</body>
</html>
